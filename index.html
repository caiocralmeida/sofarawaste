        <!-- Controles de toque: teclas que o jogo lê.
             Setas = andar, E = interagir, Espaço = minerar, Shift = dash, Tab = construir, Esc = pausar.
             Se algum botão não responder, troque o código em KEYS. -->
        <script>
            var KEYS = {
                left: 37, up: 38, right: 39, down: 40,
                interact: 69, mine: 32, dash: 16, build: 9, pause: 27
            };

            function fireKey(type, keyCode) {
                var ev = new KeyboardEvent(type, { bubbles: true, cancelable: true });
                Object.defineProperty(ev, 'keyCode', { get: function () { return keyCode; } });
                Object.defineProperty(ev, 'which',   { get: function () { return keyCode; } });
                window.dispatchEvent(ev);
            }

            document.querySelectorAll('[data-key]').forEach(function (btn) {
                var name = btn.getAttribute('data-key');
                var code = KEYS[name];
                var isPause = name === 'pause';
                function down(e) {
                    e.preventDefault();
                    btn.classList.add('active');
                    fireKey('keydown', code);
                    if (isPause) { setTimeout(function () { fireKey('keyup', code); btn.classList.remove('active'); }, 60); }
                }
                function up(e) {
                    e.preventDefault();
                    btn.classList.remove('active');
                    if (!isPause) fireKey('keyup', code);
                }
                btn.addEventListener('pointerdown', down);
                btn.addEventListener('pointerup', up);
                btn.addEventListener('pointercancel', up);
                btn.addEventListener('pointerleave', up);
                btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            });

            (function () {
                var btn = document.getElementById('fsBtn');
                var icon = document.getElementById('fsIcon');
                var el = document.documentElement;
                var canReq = !!(el.requestFullscreen || el.webkitRequestFullscreen);
                var isFs = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
                var ENTER = 'M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15';
                var EXIT  = 'M9 4 V9 H4 M20 9 H15 V4 M15 20 V15 H20 M4 15 H9 V20';

                if (!canReq) { btn.hidden = true; return; }

                function refresh() {
                    icon.firstElementChild.setAttribute('d', isFs() ? EXIT : ENTER);
                    btn.setAttribute('aria-label', isFs() ? 'Sair da tela cheia' : 'Tela cheia');
                }

                btn.hidden = false;
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    try {
                        if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                        else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                    } catch (err) { console.warn('Tela cheia indisponível:', err); }
                });
                document.addEventListener('fullscreenchange', refresh);
                document.addEventListener('webkitfullscreenchange', refresh);
                refresh();
            })();
        </script>
